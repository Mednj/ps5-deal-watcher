name: ps5-deal-watcher
x-common: &common
  image: ps5-deal-watcher:0.1.0
  build: .
  restart: unless-stopped
  init: true
  environment:
    DATA_DIR: /data
    APP_PASSWORD_HASH: ${APP_PASSWORD_HASH:-}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  volumes:
    - watcher-data:/data
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: '3'
services:
  web:
    <<: *common
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8765}:8765'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
  worker:
    <<: *common
    command: [python, -m, app.worker]
    healthcheck:
      test: [CMD, python, -m, scripts.healthcheck]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
volumes:
  watcher-data:
