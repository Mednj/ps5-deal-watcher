name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ps5-deal-watcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests and Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Build all Compose images
        run: docker compose build --pull web worker monitor backup browser

  deploy:
    name: Deploy to home server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: [self-hosted, Linux, X64, ps5-deal-watcher]
    timeout-minutes: 20
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4

      - name: Redeploy Compose stack and verify health
        run: ./scripts/deploy_compose.sh
